<meta charset="utf-8">
<!--
  ============================================================================
  JOYCRAFT REVIEW GATE · FIXED-STRUCTURE TEMPLATE
  ============================================================================
  This is a LOCKED skeleton. Any Joycraft gate skill (brief review, design
  review, decompose review, research readout, tune report, optimize audit)
  fills the content slots to render its review artifact; it MUST NOT alter the
  structure, the class names, or the CSS below. Keeping the skeleton fixed is
  the whole point: freeform per-gate HTML would make every review a fresh
  hand-rolled artifact, and the human would relearn the page each time.

  This template is a deliberate extension of the decision dossier's design
  system, not a second one — the same tokens, the same type stack, the same
  self-containment contract. The dossier keeps its own skeleton for decide;
  this one covers every other gate.

  Slots are the HTML comments below whose text begins with the slot marker
  (the word SLOT followed by a colon and a region name). Each names a region
  and gives filling guidance. Replace the slot comment (and any placeholder)
  with real markup that uses ONLY the classes already defined in the style
  block. (This contract comment intentionally does not nest a literal example
  of the slot delimiters, because a nested comment terminator would end this
  comment early and dump the rest onto the page.)

  CONTRACT · the filling agent MUST:
    · Fill ONLY the slot regions. Do not invent classes, restyle, add fonts, or
      add external references of any kind.
    · Keep the document self-contained: ZERO external requests. No CDN, no
      remote fonts, no remote images, no external scripts. Fonts are system
      stacks only; the sole JS permitted is the inline theme handler at the end.
    · Keep the header's context strip container even when empty; the layout
      copes with an empty strip, so do not remove the container.
    · Repeat the content section (section class "sec") once per topic. Inside a
      section, use only the pre-defined blocks: the "pillars" card grid, a
      "tablebox" wrapping a table, the "cols" must / must-not columns, or the
      "criteria" checklist. Do not add block types.
    · Repeat the question card (div class "q") once per open question. If the
      gate has NO open questions, delete the whole questions section — the
      layout copes.
    · Keep the how-to-answer box, and keep it naming the reject-this-framing
      escape (the human can reject the framing outright and say what is right
      instead).
    · Never present an unverified claim as settled. A gate artifact is a
      persuasive object; say plainly which rows are grounded facts and which
      are proposals awaiting the human's word.

  Structure order is fixed: header (eyebrow, h1, dek, context strip), then one
  or more content sections, then the optional questions section, then the
  how-to-answer box, then footer. Do not reorder.
  ============================================================================
-->
<!-- SLOT:title · page title text, e.g. "Decompose Review — <feature-name>" -->
<title>Review Gate — TEMPLATE</title>
<style>
  /* Design tokens: light theme is the default set on :root. These are the
     decision dossier's tokens verbatim — one design system, two skeletons. */
  :root {
    --ground: #F5F6F8; --surface: #FFFFFF; --surface-2: #EEF1F5;
    --ink: #1B2430; --ink-2: #4E5A6E; --ink-3: #7C8698;
    --accent: #2F4E8C; --accent-ink: #2F4E8C; --accent-wash: #E9EEF7;
    --rule: #E2E6EC; --rule-strong: #C9D0DB;
    --good-ink: #1E6B45; --good-wash: #DFF2E7;
    --warn-ink: #92550C; --warn-wash: #F8EDDA;
    --bad-ink: #8C3A32; --bad-wash: #F7E7E4;
  }
  /* Dark tokens follow the OS preference by default... */
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #12151C; --surface: #1A1F29; --surface-2: #212734;
      --ink: #E6EAF2; --ink-2: #A8B2C4; --ink-3: #78829A;
      --accent: #8CA5E8; --accent-ink: #A6BAF0; --accent-wash: #232C42;
      --rule: #2A3140; --rule-strong: #3A4356;
      --good-ink: #7ED0A4; --good-wash: #17301F;
      --warn-ink: #E8B36A; --warn-wash: #33270F;
      --bad-ink: #E39C92; --bad-wash: #34201D;
    }
  }
  /* ...and an explicit data-theme override wins in both directions, so a
     viewer's theme toggle stamps :root[data-theme] and beats the OS default. */
  :root[data-theme="dark"] {
    --ground: #12151C; --surface: #1A1F29; --surface-2: #212734;
    --ink: #E6EAF2; --ink-2: #A8B2C4; --ink-3: #78829A;
    --accent: #8CA5E8; --accent-ink: #A6BAF0; --accent-wash: #232C42;
    --rule: #2A3140; --rule-strong: #3A4356;
    --good-ink: #7ED0A4; --good-wash: #17301F;
    --warn-ink: #E8B36A; --warn-wash: #33270F;
    --bad-ink: #E39C92; --bad-wash: #34201D;
  }
  :root[data-theme="light"] {
    --ground: #F5F6F8; --surface: #FFFFFF; --surface-2: #EEF1F5;
    --ink: #1B2430; --ink-2: #4E5A6E; --ink-3: #7C8698;
    --accent: #2F4E8C; --accent-ink: #2F4E8C; --accent-wash: #E9EEF7;
    --rule: #E2E6EC; --rule-strong: #C9D0DB;
    --good-ink: #1E6B45; --good-wash: #DFF2E7;
    --warn-ink: #92550C; --warn-wash: #F8EDDA;
    --bad-ink: #8C3A32; --bad-wash: #F7E7E4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink);
    font-family: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 16.5px; line-height: 1.5; }
  .sans, h1, h2, h3, .chip, .eyebrow, .tag { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
  .mono, .spec-name { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 24px 90px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-ink); }
  header { padding-top: 56px; }
  h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 700; letter-spacing: -0.015em; line-height: 1.08; margin: 12px 0 12px; text-wrap: balance; }
  .dek { font-size: 18px; color: var(--ink-2); max-width: 64ch; margin: 0 0 22px; }

  /* Context strip: grounded facts as .lock-chip spans; .open marks an item that
     is still unsettled. The container stays even when empty. */
  .locked { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 18px; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); }
  .lock-chip { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 100px; background: var(--good-wash); color: var(--good-ink); font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
  .lock-chip.open { background: var(--warn-wash); color: var(--warn-ink); }

  /* Content section. Repeat once per topic. */
  section.sec { margin-top: 54px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 10px; margin-bottom: 8px; }
  .sec-head h2 { margin: 0; }
  h2 { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { font-size: 14.5px; color: var(--ink-2); margin: 10px 0 18px; max-width: 74ch; }

  /* Block A — pillars: a card grid for 2–4 parallel ideas. */
  .pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .pillar { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
  .pillar h3 { font-size: 15.5px; font-weight: 700; margin: 0 0 6px; }
  .pillar p { margin: 0; font-size: 14px; color: var(--ink-2); }

  /* Block B — tablebox: any table (spec lists, decomposition plans). Scrolls
     inside its own box on narrow screens so the body never scrolls. */
  .tablebox { margin-top: 6px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto; }
  .tablebox table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
  .tablebox th { text-align: left; font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); padding: 12px 16px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
  .tablebox td { padding: 11px 16px; border-bottom: 1px solid var(--rule); color: var(--ink-2); vertical-align: top; }
  .tablebox tr:last-child td { border-bottom: none; }
  .spec-name { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .size { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 2px 8px; border-radius: 100px; background: var(--surface-2); color: var(--ink-2); font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; white-space: nowrap; }
  .wave { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--accent-wash); color: var(--accent-ink); font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; white-space: nowrap; }

  /* Block C — cols: the must / must-not pair. */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 680px) { .cols { grid-template-columns: 1fr; } }
  .col { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 18px; }
  .col .clab { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
  .col ul { margin: 9px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .col li { color: var(--ink-2); margin-bottom: 5px; line-height: 1.4; }
  .col.must li::before { content: "✓ "; color: var(--good-ink); font-weight: 700; }
  .col.must-not li::before { content: "✗ "; color: var(--bad-ink); font-weight: 700; }

  /* Block D — criteria: an acceptance checklist. */
  .criteria { margin: 6px 0 0; padding: 0; list-style: none; }
  .criteria li { position: relative; padding: 9px 0 9px 26px; border-bottom: 1px solid var(--rule); font-size: 14.5px; color: var(--ink-2); }
  .criteria li:last-child { border-bottom: none; }
  .criteria li::before { content: "□"; position: absolute; left: 2px; color: var(--ink-3); }
  .criteria li.met::before { content: "☑"; color: var(--good-ink); }

  /* Questions. One .q card per open question; amber left border. */
  .questions { margin-top: 54px; }
  .q { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--warn-ink); border-radius: 8px; padding: 18px 22px; margin-top: 12px; }
  .q .qnum { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn-ink); font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
  .q h3 { font-size: 16.5px; font-weight: 700; margin: 6px 0 8px; }
  .q .rec { font-size: 14.5px; color: var(--ink); margin: 0 0 6px; }
  .q .rec strong { color: var(--accent-ink); }
  .q .why { font-size: 14px; color: var(--ink-2); margin: 0; max-width: 74ch; }

  .howto { margin-top: 48px; background: var(--accent-wash); border-radius: 8px; padding: 20px 26px; }
  .howto p { margin: 6px 0 0; font-size: 15px; color: var(--ink); max-width: none; }
  footer { margin-top: 56px; border-top: 1px solid var(--rule-strong); padding-top: 16px; font-size: 13px; color: var(--ink-3); }

  /* Images, if any slot ever adds one, never force the body to scroll. */
  img { max-width: 100%; height: auto; }
</style>

<div class="wrap">
<header>
  <!-- SLOT:eyebrow — kicker line, e.g. "Joycraft Decompose Review · feature: <name> · <Month DD, YYYY>" -->
  <div class="eyebrow"></div>
  <!-- SLOT:title-h1 — the headline: what this gate is presenting, in a phrase -->
  <h1></h1>
  <!-- SLOT:dek — 1–2 sentence standfirst: what this artifact is, what the human is being asked to do with it -->
  <p class="dek"></p>
  <!-- SLOT:context-strip — REQUIRED CONTAINER, keep even if empty.
       Fill with .lock-chip spans, one per grounded fact carried into this gate
       (locked decisions, detected stack, spec count). Add the .open variant for
       an item that is still unsettled. Shape: a span with class lock-chip per
       fact; add the open class to the ones that are not settled.
  -->
  <div class="locked"></div>
</header>

<!-- SLOT:sections — REPEAT this <section class="sec"> once per topic. Inside,
     use ONLY the pre-defined blocks below; delete the ones this section does
     not need. Do not invent block types.
       .pillars  — card grid for 2–4 parallel ideas
       .tablebox — a table (spec / decomposition lists) that scrolls its own box
       .cols     — the must / must-not pair
       .criteria — an acceptance checklist
-->
<section class="sec">
  <div class="sec-head">
    <!-- SLOT:section-eyebrow — short kicker, e.g. "Shape" / "Plan" / "Boundaries" -->
    <span class="eyebrow"></span>
    <!-- SLOT:section-title — the section heading -->
    <h2></h2>
  </div>
  <!-- SLOT:section-standfirst — OPTIONAL one-paragraph orientation; delete if the blocks speak for themselves -->
  <p class="sub"></p>

  <!-- SLOT:block-pillars — OPTIONAL. One .pillar per idea: an h3 name and one
       paragraph. Delete the whole .pillars grid if unused. -->
  <div class="pillars">
    <div class="pillar">
      <h3></h3>
      <p></p>
    </div>
  </div>

  <!-- SLOT:block-table — OPTIONAL. Fill the table with one row per item. Use
       .spec-name on the identifier cell, .size for an effort chip, .wave for a
       wave/ordering chip. Delete the whole .tablebox if unused. -->
  <div class="tablebox">
    <table>
      <thead>
        <tr><th></th><th></th><th></th></tr>
      </thead>
      <tbody>
        <tr><td class="spec-name"></td><td><span class="size"></span></td><td><span class="wave"></span></td></tr>
      </tbody>
    </table>
  </div>

  <!-- SLOT:block-cols — OPTIONAL must / must-not pair. One li per item.
       Delete the whole .cols grid if unused. -->
  <div class="cols">
    <div class="col must">
      <span class="clab">Must</span>
      <ul></ul>
    </div>
    <div class="col must-not">
      <span class="clab">Must not</span>
      <ul></ul>
    </div>
  </div>

  <!-- SLOT:block-criteria — OPTIONAL acceptance checklist. One li per criterion;
       add class "met" to a criterion already satisfied. Delete if unused. -->
  <ul class="criteria"></ul>
</section>

<!-- SLOT:questions — OPTIONAL WHOLE SECTION. Delete it entirely when the gate
     carries no open questions; the layout copes. When kept, REPEAT the .q card
     once per question. Questions reaching this artifact have already been
     through the decide gate, so each card shows either the stamped answer or
     the forced choice still awaiting one.
-->
<section class="questions">
  <div class="sec-head">
    <span class="eyebrow">Open</span>
    <h2>Questions for you</h2>
  </div>
  <div class="q">
    <!-- SLOT:question-number — e.g. "Q1" -->
    <span class="qnum"></span>
    <!-- SLOT:question — the question itself, framed as a question -->
    <h3></h3>
    <!-- SLOT:question-recommend — the recommendation line; lead with a bolded
         "Recommend:" and name the option -->
    <p class="rec"></p>
    <!-- SLOT:question-why — ONE paragraph on why: the tension that makes this
         genuinely open, and what the recommendation rests on -->
    <p class="why"></p>
  </div>
</section>

<div class="howto">
  <div class="eyebrow">How to answer</div>
  <!-- SLOT:howto — how the human answers this gate: what a yes looks like, what
       a change request looks like, where the answers land. MUST name the
       reject-this-framing escape: if the framing itself is wrong, the human
       rejects it outright and says what is right instead, rather than picking
       from the options offered. -->
  <p></p>
</div>

<footer>
  <!-- SLOT:footer — provenance line: which gate produced this, feature slug, date -->
  <p></p>
</footer>
</div>

<script>
  // Theme handling only (the sole permitted JS). A viewer/host may stamp
  // data-theme on <html>; if none is set we defer to prefers-color-scheme via
  // the CSS above. This block lets a ?theme=dark|light query param force it for
  // local preview without any network access.
  (function () {
    try {
      var t = new URLSearchParams(location.search).get("theme");
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) { /* no-op: theme falls back to prefers-color-scheme */ }
  })();
</script>
