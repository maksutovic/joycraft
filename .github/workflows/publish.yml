# Every main merge publishes automatically after packaged verification.
# Source is pinned to the event SHA; version metadata is prepared in the runner.
name: Verify and publish npm release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Immutable main commit SHA for a retained-artifact retry'
        required: true
        type: string
      version:
        description: 'Exact version in the retained artifact'
        required: true
        type: string
      artifact_run_id:
        description: 'Run containing the retained artifact (required for manual retries)'
        required: true
        type: string
      artifact_name:
        description: 'Retained artifact name; defaults to joycraft-release-<SHA>'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-candidate-joycraft
  cancel-in-progress: false

jobs:
  pack:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout immutable main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Verify source is merged into main
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node scripts/release-preparation.mjs verify-commit --release-sha "$RELEASE_SHA"
      - name: Download retained artifact for retry
        if: inputs.artifact_run_id != '' || github.run_attempt > 1
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          name: ${{ inputs.artifact_name || format('joycraft-release-{0}', inputs.release_sha || github.sha) }}
          path: release-artifact
          github-token: ${{ github.token }}
      - name: Validate retained artifact for retry
        if: inputs.artifact_run_id != '' || github.run_attempt > 1
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-preparation.mjs validate-retained --manifest release-artifact/release-artifact.json --release-sha "$RELEASE_SHA" --version "${RELEASE_VERSION:-$(node -p "require('./release-artifact/release-artifact.json').version")}" --package-name joycraft

      - name: Setup pnpm
        if: inputs.artifact_run_id == '' && github.run_attempt == 1
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Prepare automatic release metadata
        if: inputs.artifact_run_id == '' && github.run_attempt == 1
        id: version
        run: |
          node scripts/automatic-release.mjs > automatic-release.json
          echo "version=$(node -p "require('./automatic-release.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install and verify reviewed release
        if: inputs.artifact_run_id == '' && github.run_attempt == 1
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          pnpm typecheck

      - name: Pack once and retain integrity manifest
        if: inputs.artifact_run_id == '' && github.run_attempt == 1
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-preparation.mjs pack --artifact-dir release-artifact --release-sha "$RELEASE_SHA" --expected-version "$RELEASE_VERSION"

      - name: Resolve validated retained tarball
        id: artifact
        if: success()
        shell: bash
        run: |
          TARBALL=$(node -e "const fs=require('fs'); const path=require('path'); const dir=path.resolve('release-artifact'); const m=JSON.parse(fs.readFileSync(path.join(dir,'release-artifact.json'),'utf8')); if (!m.tarball || path.basename(m.tarball)!==m.tarball || !m.tarball.endsWith('.tgz')) throw new Error('unsafe retained tarball filename'); process.stdout.write(path.join(dir,m.tarball));")
          [[ -f "$TARBALL" ]] || { echo 'retained tarball is missing' >&2; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload durable release artifact
        if: inputs.artifact_run_id == '' && github.run_attempt == 1
        uses: actions/upload-artifact@v4
        with:
          name: joycraft-release-${{ inputs.release_sha || github.sha }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Retain previous package for consumer update verification
        if: success()
        env:
          PACKAGE: joycraft
        run: |
          mkdir -p release-previous
          npm pack "$PACKAGE@latest" --json --ignore-scripts --pack-destination release-previous > release-previous/pack.json
          node -e "const fs=require('fs'); const path=require('path'); const record=JSON.parse(fs.readFileSync('release-previous/pack.json','utf8'))[0]; if(!record?.filename) throw new Error('previous package was not retained'); fs.writeFileSync('release-previous/tarball.txt',path.resolve('release-previous',record.filename));"

      - name: Verify retained artifact with fresh init and previous-version update
        if: success()
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version || inputs.version }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION:-$(node -p "require('./release-artifact/release-artifact.json').version")}"
          PREVIOUS=$(node -p "require('fs').readFileSync('release-previous/tarball.txt','utf8').trim()")
          node scripts/release-verification.mjs verify-consumers \
            --manifest release-artifact/release-artifact.json \
            --release-sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --package joycraft \
            --previous-tarball "$PREVIOUS" \
            --root release-consumers


  compatibility:
    name: Required packaged compatibility matrix
    needs: pack
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
      artifact_name: ${{ inputs.artifact_name || format('joycraft-release-{0}', inputs.release_sha || github.sha) }}
      artifact_run_id: ${{ inputs.artifact_run_id || github.run_id }}
    secrets: inherit

  publish:
    needs: [pack, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout immutable main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          name: ${{ inputs.artifact_name || format('joycraft-release-{0}', inputs.release_sha || github.sha) }}
          path: release-artifact
          github-token: ${{ github.token }}
      - name: Download required compatibility report
        uses: actions/download-artifact@v4
        with:
          name: joycraft-required-validation-${{ inputs.release_sha || github.sha }}-${{ github.run_attempt }}
          path: required-validation
          github-token: ${{ github.token }}
      - name: Validate exact artifact and required report
        id: artifact
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { resolveRetainedArtifact } from './scripts/release-preparation.mjs';
          import { validateRequiredValidationReport } from './scripts/release-verification.mjs';
          const artifact = await resolveRetainedArtifact({ manifestPath: 'release-artifact/release-artifact.json', expected: { releaseSha: process.env.RELEASE_SHA, version: process.env.RELEASE_VERSION || undefined, packageName: 'joycraft' } });
          const report = JSON.parse(readFileSync('required-validation/report.json', 'utf8'));
          const checks = JSON.parse(readFileSync('.github/release-required-checks.json', 'utf8'));
          validateRequiredValidationReport(report, { releaseSha: artifact.releaseSha, version: artifact.version, integrity: artifact.integrity, requiredChecks: checks.requiredChecks });
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${artifact.tarball}\nversion=${artifact.version}\n`);
          JS
      - name: Publish verified tarball to latest using OIDC
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          STATUS=0
          EXISTING=$(npm view "joycraft@$VERSION" dist.integrity --json 2>registry-error.txt) || STATUS=$?
          if [[ "$STATUS" != 0 ]]; then
            if ! grep -qiE 'E404|404 Not Found|not found' registry-error.txt; then
              cat registry-error.txt >&2
              exit "$STATUS"
            fi
            EXISTING=''
          fi
          RETAINED=$(node -p "require('./release-artifact/release-artifact.json').integrity")
          if [[ -n "$EXISTING" ]]; then
            EXISTING=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$EXISTING")
            [[ "$EXISTING" == "$RETAINED" ]] || { echo 'Published version differs from retained artifact' >&2; exit 1; }
          else
            npm publish "$TARBALL" --access public --tag latest
          fi
          LATEST=$(npm view joycraft dist-tags.latest)
          [[ "$LATEST" == "$VERSION" ]] || { echo 'Publication is not reflected in latest; inspect registry before retrying' >&2; exit 1; }
      - name: Create GitHub release for the published source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$RELEASE_SHA" --title "v$VERSION" --generate-notes --latest
          fi
