# Run tests, type checking and the release gates on every PR. On main, publish.yml
# calls this workflow for the pushed commit, so it does not also run on push.
# A PR also runs main's own gates, package validation and upgrade test on the
# PR tarball: checks this change cannot edit.
name: Test

on:
  workflow_call:
    inputs:
      release_sha:
        required: false
        type: string
        default: ''
      artifact_name:
        required: false
        type: string
        default: ''
      artifact_run_id:
        required: false
        type: string
        default: ''
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: inputs.artifact_name == ''
    # Hard wall so a hung test fails in minutes, not the ~6h GitHub default.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Pack retained validation artifact
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release-preparation.mjs pack --artifact-dir release-artifact --release-sha "$RELEASE_SHA" --expected-version "$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" --package-name joycraft

      - name: Upload retained validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: joycraft-validation-artifact-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Name the candidate tarball
        run: echo "TARBALL=$GITHUB_WORKSPACE/release-artifact/$(node -p "JSON.parse(require('fs').readFileSync('release-artifact/release-artifact.json','utf8')).tarball")" >> "$GITHUB_ENV"

      - name: Release gates (named checks)
        run: node scripts/release-gates.mjs --tarball "$TARBALL"

      - name: Upgrade from the last published release
        env:
          JOYCRAFT_UPGRADE_TARBALL: ${{ env.TARBALL }}
        run: pnpm exec vitest run tests/upgrade-from-published.test.ts

      # Holdout: main's copies of the checks, run on this PR's tarball.
      - name: Check out main's checks
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      - name: Main's release gates on this tarball
        if: github.event_name == 'pull_request'
        run: node base/scripts/release-gates.mjs --tarball "$TARBALL"

      - name: Main's package validation on this tarball
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          node scripts/validate-package.mjs \
            --manifest "$GITHUB_WORKSPACE/release-artifact/release-artifact.json" \
            --os ubuntu \
            --node "$(node -p process.versions.node)" \
            --output "$RUNNER_TEMP/base-validation.json"

      - name: Main's upgrade test on this tarball
        if: github.event_name == 'pull_request'
        env:
          JOYCRAFT_UPGRADE_TARBALL: ${{ env.TARBALL }}
        run: |
          if [ -f base/tests/upgrade-from-published.test.ts ]; then
            cp base/tests/upgrade-from-published.test.ts tests/holdout-upgrade-from-published.test.ts
            pnpm exec vitest run tests/holdout-upgrade-from-published.test.ts
          else
            echo "main has no upgrade test yet; this branch's copy ran above"
          fi

  compatibility:
    name: Compatibility · ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.artifact_name != '')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
            node: 22.23.1
          - os: ubuntu
            runner: ubuntu-latest
            node: 24.20.0
          - os: ubuntu
            runner: ubuntu-latest
            node: 22.0.0
          - os: macos
            runner: macos-latest
            node: 22.23.1
          - os: macos
            runner: macos-latest
            node: 24.20.0
          - os: windows
            runner: windows-latest
            node: 22.23.1
          - os: windows
            runner: windows-latest
            node: 24.20.0
    steps:
      - name: Checkout immutable validation source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1

      - name: Setup consumer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download retained candidate artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          name: ${{ inputs.artifact_name }}
          path: release-artifact
          github-token: ${{ github.token }}

      - name: Download local validation artifact
        if: inputs.artifact_name == ''
        uses: actions/download-artifact@v4
        with:
          name: joycraft-validation-artifact-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifact

      - name: Run packaged compatibility matrix cell
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          mkdir -p reports
          node scripts/validate-package.mjs \
            --manifest release-artifact/release-artifact.json \
            --os '${{ matrix.os }}' \
            --node '${{ matrix.node }}' \
            --output "reports/report-${{ matrix.os }}-${{ matrix.node }}.json"

      - name: Upload required compatibility cell report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joycraft-required-validation-cell-${{ inputs.release_sha || github.sha }}-${{ matrix.os }}-${{ matrix.node }}-${{ github.run_attempt }}
          path: reports/report-${{ matrix.os }}-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 90

  required-validation:
    name: Required compatibility report
    needs: compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable validation source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Download retained candidate artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          name: ${{ inputs.artifact_name }}
          path: release-artifact
          github-token: ${{ github.token }}

      - name: Download local validation artifact
        if: inputs.artifact_name == ''
        uses: actions/download-artifact@v4
        with:
          name: joycraft-validation-artifact-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifact

      - name: Download all compatibility cell reports
        uses: actions/download-artifact@v4
        with:
          pattern: joycraft-required-validation-cell-${{ inputs.release_sha || github.sha }}-*-${{ github.run_attempt }}
          path: required-validation/cells
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Aggregate independently configured required checks
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('release-artifact/release-artifact.json','utf8')).version")
          INTEGRITY=$(node -p "JSON.parse(require('fs').readFileSync('release-artifact/release-artifact.json','utf8')).integrity")
          node scripts/release-validation.mjs aggregate \
            --reports-dir required-validation/cells \
            --output required-validation/report.json \
            --required-checks-file .github/release-required-checks.json \
            --release-sha "$RELEASE_SHA" \
            --version "$VERSION" \
            --integrity "$INTEGRITY"

      - name: Upload immutable required validation report
        uses: actions/upload-artifact@v4
        with:
          name: joycraft-required-validation-${{ inputs.release_sha || github.sha }}-${{ github.run_attempt }}
          path: required-validation/report.json
          if-no-files-found: error
          retention-days: 90
