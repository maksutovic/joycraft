# Prepare one reviewed release PR for product changes on main.
# The lock queues preparation runs and never cancels an active preparation.
name: Prepare release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-preparation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Find changed files
        shell: bash
        run: |
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" || -z "${{ github.event.before }}" ]]; then
            git diff-tree --no-commit-id --name-only -r "$MAIN_SHA" > changed-files.txt
          else
            git diff --name-only "${{ github.event.before }}" "$MAIN_SHA" > changed-files.txt
          fi

      - name: Resolve durable prepared baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-preparation.mjs resolve-baseline --repository "$GITHUB_REPOSITORY" --current-sha "$MAIN_SHA" > release-baseline.json
          node -e "const p=require('./release-baseline.json'); process.stdout.write(p.baselineSha || '')" > release-baseline-sha.txt
          node -e "const p=require('./release-baseline.json'); process.stdout.write(p.reservedVersion || '')" > release-reserved-version.txt
          node -e "const p=require('./release-baseline.json'); process.stdout.write(p.preparedVersion || '')" > release-prepared-version.txt
          echo "baseline-sha=$(cat release-baseline-sha.txt)" >> "$GITHUB_OUTPUT"
          echo "reserved-version=$(cat release-reserved-version.txt)" >> "$GITHUB_OUTPUT"
          echo "prepared-version=$(cat release-prepared-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Determine unprepared product changes
        id: product
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline-sha }}
        run: |
          BASELINE_ARGS=()
          [[ -n "$BASELINE_SHA" ]] && BASELINE_ARGS+=(--baseline-sha "$BASELINE_SHA")
          node scripts/release-preparation.mjs has-unprepared-product --current-sha "$MAIN_SHA" --changed-files-file changed-files.txt "${BASELINE_ARGS[@]}" > product-state.json
          echo "has-product=$(node -p "String(require('./product-state.json').hasUnpreparedProductChanges)")" >> "$GITHUB_OUTPUT"

      - name: Plan release preparation
        id: plan
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          PLAN_ARGS=(--release-sha "$MAIN_SHA" --version "$VERSION")
          if [[ "${{ steps.product.outputs.has-product }}" != "true" ]]; then
            PLAN_ARGS+=(--skip-release-preparation)
          fi
          while IFS= read -r file; do
            [[ -n "$file" ]] && PLAN_ARGS+=(--file "$file")
          done < <(node -e "const p=require('./product-state.json'); for (const file of p.files || []) console.log(file)")
          node scripts/release-preparation.mjs plan "${PLAN_ARGS[@]}" > release-plan.json
          echo "should-prepare=$(node -p "String(require('./release-plan.json').shouldPrepare)")" >> "$GITHUB_OUTPUT"

      - name: Stop for docs-only changes
        if: steps.plan.outputs.should-prepare != 'true'
        run: echo 'Docs-only change; no release PR is needed.'

      - name: Resolve the explicit release version
        if: steps.plan.outputs.should-prepare == 'true'
        id: version
        shell: bash
        env:
          RESERVED_VERSION: ${{ steps.baseline.outputs.reserved-version }}
          PREPARED_VERSION: ${{ steps.baseline.outputs.prepared-version }}
        run: |
          VERSION_ARGS=(--package-json package.json)
          [[ -n "$RESERVED_VERSION" ]] && VERSION_ARGS+=(--reserved-version "$RESERVED_VERSION")
          [[ -n "$PREPARED_VERSION" ]] && VERSION_ARGS+=(--prepared-version "$PREPARED_VERSION")
          node scripts/release-preparation.mjs resolve-version "${VERSION_ARGS[@]}" > release-version.json
          node -e "const p=require('./release-version.json'); if (!p.ok) { console.error(p.error); process.exit(1); } process.stdout.write(p.version)" > release-version.txt
          echo "version=$(cat release-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Refresh the single release branch
        if: steps.plan.outputs.should-prepare == 'true'
        env:
          MAIN_SHA: ${{ env.MAIN_SHA }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-preparation.mjs prepare-branch --main-sha "$MAIN_SHA" --version "$VERSION"

      - name: Create or refresh the one release PR
        if: steps.plan.outputs.should-prepare == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-preparation.mjs sync-pr --version "$VERSION"
